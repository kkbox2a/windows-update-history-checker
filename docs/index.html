<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Windows Update History Checker</title>
  <link rel="icon" type="image/png" href="assets/app_icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <img class="logo" src="assets/app_icon.png" alt="">
      <div class="hero-copy">
        <p class="eyebrow">MICROSOFT UPDATE TRACKER</p>
        <h1>Windows 11<br>更新紀錄檢查器</h1>
        <p class="subtitle">同時追蹤 25H2 正式版與 26H2 Dev / Experimental 測試版本。</p>
      </div>
      <a class="github-link" href="https://github.com/kkbox2a/windows-update-history-checker" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 開啟專案">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 .7a11.3 11.3 0 0 0-3.57 22.02c.57.1.77-.25.77-.55v-2.16c-3.15.69-3.81-1.34-3.81-1.34-.51-1.31-1.26-1.66-1.26-1.66-1.03-.71.08-.7.08-.7 1.14.08 1.74 1.18 1.74 1.18 1.01 1.75 2.66 1.24 3.31.95.1-.74.4-1.24.72-1.53-2.51-.29-5.15-1.27-5.15-5.61 0-1.24.44-2.25 1.17-3.05-.12-.29-.51-1.45.11-3.01 0 0 .95-.31 3.11 1.16A10.72 10.72 0 0 1 12 6c.96 0 1.93.13 2.83.38 2.16-1.47 3.11-1.16 3.11-1.16.62 1.56.23 2.72.11 3.01.73.8 1.17 1.81 1.17 3.05 0 4.35-2.65 5.31-5.17 5.59.41.35.77 1.04.77 2.09v3.2c0 .3.21.66.78.55A11.3 11.3 0 0 0 12 .7Z"/>
        </svg>
        <span>GitHub</span>
      </a>
    </div>
  </header>

  <main>
    <nav class="channel-tabs" aria-label="Windows 更新頻道">
      <button class="channel-tab active" data-channel="stable" type="button">
        <span class="channel-tab-title">Windows 11 25H2</span>
        <span class="channel-tab-subtitle">正式版</span>
      </button>
      <button class="channel-tab" data-channel="dev" type="button">
        <span class="channel-tab-title">Windows 11 26H2</span>
        <span class="channel-tab-subtitle">Dev / Experimental</span>
      </button>
    </nav>

    <section id="status" class="status-card loading">正在載入更新資料…</section>

    <section id="latest-section" class="section hidden">
      <div class="section-heading">
        <div><p class="eyebrow">LATEST UPDATE</p><h2 id="latest-heading">目前最新版本</h2></div>
      </div>
      <div id="latest-card"></div>
    </section>

    <section class="section">
      <div class="section-heading controls-heading">
        <div><p class="eyebrow">UPDATE ARCHIVE</p><h2 id="archive-heading">過往版本</h2></div>
        <div class="controls">
          <input id="search" type="search" placeholder="搜尋 KB、Build、日期…" aria-label="搜尋更新">
          <select id="type-filter" aria-label="更新類型">
            <option value="all">全部類型</option>
            <option value="Security / Cumulative">正式更新</option>
            <option value="Preview">Preview</option>
            <option value="Out-of-band">Out-of-band</option>
          </select>
          <button id="copy-visible" class="button secondary">複製目前顯示項目</button>
        </div>
      </div>
      <div id="result-count" class="result-count"></div>
      <div id="updates" class="update-grid"></div>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <footer>資料來源：Microsoft Support、Microsoft Update Catalog 與 Windows Insider Program。網站資料由 GitHub Actions 自動更新。</footer>
  <script src="app.js"></script>
</body>
</html>
