name: Update Windows history and deploy Pages

on:
  workflow_dispatch:
  schedule:
    # 每週三台灣時間上午 8:47（UTC 00:47）
    - cron: "47 0 * * 3"
    # 備援排程：每週三台灣時間上午 9:17（UTC 01:17）
    - cron: "17 1 * * 3"
  push:
    branches: [main]
    paths-ignore:
      - "data/updates.json"
      - "docs/data/updates.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: windows-update-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run parser tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Decide whether Microsoft data must be refreshed
        id: refresh-check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled or manual run: refresh enabled."
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if git diff --name-only "$BEFORE" "$AFTER" | grep -Eq '^scripts/fetch_updates(_v[0-9]+)?\.py$|^scripts/validate_data\.py$|^\.github/workflows/update-and-deploy\.yml$'; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Fetcher or workflow changed: refresh enabled."
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            echo "Code-only push: using existing cached data."
          fi

      - name: Fetch Microsoft update history
        if: steps.refresh-check.outputs.refresh == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/fetch_updates_v3.py

      - name: Record last check time
        if: steps.refresh-check.outputs.refresh == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          checked_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          for filename in ("data/updates.json", "docs/data/updates.json"):
              path = Path(filename)
              data = json.loads(path.read_text(encoding="utf-8"))
              data["last_checked_at"] = checked_at
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          print(f"Last check completed at {checked_at}")
          PY

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Verify Dev data consistency
        if: steps.refresh-check.outputs.refresh == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json

          data = json.load(open("data/updates.json", encoding="utf-8"))
          dev = data["channels"]["dev"]
          latest = dev["updates"][0]["id"]
          assert data["latest_dev_build"] == latest
          assert dev["latest_id"] == latest
          print(f"Generated latest Dev build: {latest}")
          PY

      - name: Commit data changes
        if: steps.refresh-check.outputs.refresh == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/updates.json docs/data/updates.json; then
            echo "No update-history changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/updates.json docs/data/updates.json
            LATEST=$(python -c "import json; d=json.load(open('data/updates.json', encoding='utf-8')); print(f\"{d.get('latest_kb','')} / {d.get('latest_dev_build','')}\")")
            git commit -m "data: refresh Windows 11 update history (${LATEST})"

            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Data commit pushed successfully."
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Unable to push after 3 attempts."
                exit 1
              fi

              git rebase --abort 2>/dev/null || true
              echo "Remote main changed; retrying in 5 seconds..."
              sleep 5
            done
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
