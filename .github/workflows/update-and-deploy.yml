name: Update Windows history and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/updates.json"
      - "docs/data/updates.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: windows-update-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run parser tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Fetch Microsoft update history
        run: python scripts/fetch_updates.py

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Commit data changes
        shell: bash
        run: |
          if git diff --quiet -- data/updates.json docs/data/updates.json; then
            echo "No update-history changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/updates.json docs/data/updates.json
            LATEST=$(python -c "import json; print(json.load(open('data/updates.json', encoding='utf-8'))['latest_kb'])")
            git commit -m "data: refresh Windows 11 25H2 history (${LATEST})"

            # A queued/manual run may have started from an older commit.
            # Rebase onto the latest remote main before pushing.
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Data commit pushed successfully."
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Unable to push after 3 attempts."
                exit 1
              fi

              git rebase --abort 2>/dev/null || true
              echo "Remote main changed; retrying in 5 seconds..."
              sleep 5
            done
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
