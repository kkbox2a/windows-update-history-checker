name: Update Windows history and deploy Pages

on:
  workflow_dispatch:
  schedule:
    # 每週三台灣時間上午 8:30
    - cron: "30 0 * * 3"
  push:
    branches: [main]
    paths-ignore:
      - "data/updates.json"
      - "docs/data/updates.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: windows-update-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run parser tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Decide whether Microsoft data must be refreshed
        id: refresh-check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled or manual run: refresh enabled."
            exit 0
          fi

          # Repair stale cached data immediately. Once the latest known official
          # Experimental build is present, ordinary UI/README pushes skip crawling.
          CURRENT_DEV=$(python -c "import json; print(json.load(open('data/updates.json', encoding='utf-8')).get('latest_dev_build',''))")
          if [ "$CURRENT_DEV" != "Build 26300.8935" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Cached Dev data is stale ($CURRENT_DEV): refresh enabled."
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if git diff --name-only "$BEFORE" "$AFTER" | grep -Eq '^scripts/fetch_updates(_v[0-9]+)?\.py$|^scripts/validate_data\.py$|^\.github/workflows/update-and-deploy\.yml$'; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Fetcher or workflow changed: refresh enabled."
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            echo "Code-only push: using existing cached data."
          fi

      - name: Fetch Microsoft update history
        if: steps.refresh-check.outputs.refresh == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/fetch_updates_v3.py

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Verify expected Dev build
        if: steps.refresh-check.outputs.refresh == 'true'
        shell: bash
        run: |
          DEV=$(python -c "import json; print(json.load(open('data/updates.json', encoding='utf-8')).get('latest_dev_build',''))")
          echo "Generated latest Dev build: $DEV"
          if [ "$DEV" != "Build 26300.8935" ]; then
            echo "Expected Build 26300.8935 but generated $DEV"
            exit 1
          fi

      - name: Commit data changes
        if: steps.refresh-check.outputs.refresh == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/updates.json docs/data/updates.json; then
            echo "No update-history changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/updates.json docs/data/updates.json
            LATEST=$(python -c "import json; d=json.load(open('data/updates.json', encoding='utf-8')); print(f\"{d.get('latest_kb','')} / {d.get('latest_dev_build','')}\")")
            git commit -m "data: refresh Windows 11 update history (${LATEST})"

            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Data commit pushed successfully."
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Unable to push after 3 attempts."
                exit 1
              fi

              git rebase --abort 2>/dev/null || true
              echo "Remote main changed; retrying in 5 seconds..."
              sleep 5
            done
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
